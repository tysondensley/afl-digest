name: AFL Digest

on:
  schedule:
    # All times are UTC. Australia runs AEST (UTC+10) Apr–Oct, AEDT (UTC+11) Oct–Apr.
    # Schedules below use AEST (UTC+10). During AEDT the digest arrives 1 hour late —
    # acceptable without managing two overlapping cron sets.
    #
    #  6:15 am AEST (20:15 UTC prev day)  → Morning
    - cron: '15 20 * * *'
    # 12:00 pm AEST (02:00 UTC)           → Midday
    - cron: '0 2 * * *'
    #  4:30 pm AEST (06:30 UTC)           → Afternoon
    - cron: '30 6 * * *'
    #  9:00 pm AEST (11:00 UTC)           → Evening
    - cron: '0 11 * * *'

  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Time slot label shown in subject line'
        required: false
        default: 'Midday'
        type: choice
        options:
          - Morning
          - Midday
          - Afternoon
          - Evening

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve time slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "TIME_SLOT=${{ github.event.inputs.time_slot }}" >> "$GITHUB_ENV"
          else
            HOUR=$(date -u +%H)
            if   [ "$HOUR" -eq 20 ]; then echo "TIME_SLOT=Morning"   >> "$GITHUB_ENV"
            elif [ "$HOUR" -eq 2  ]; then echo "TIME_SLOT=Midday"    >> "$GITHUB_ENV"
            elif [ "$HOUR" -eq 6  ]; then echo "TIME_SLOT=Afternoon" >> "$GITHUB_ENV"
            else                          echo "TIME_SLOT=Evening"   >> "$GITHUB_ENV"
            fi
          fi

      - name: Run AFL digest
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TIME_SLOT:          ${{ env.TIME_SLOT }}
        run: python digest.py
