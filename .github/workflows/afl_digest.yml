name: AFL Digest

on:
  # Triggered externally by cron-job.org via workflow_dispatch API calls.
  # The built-in GitHub Actions schedule has been removed to avoid duplicate sends.
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Time slot label shown in subject line'
        required: false
        default: 'Midday'
        type: choice
        options:
          - Morning
          - Midday
          - Afternoon
          - Evening

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve time slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "TIME_SLOT=${{ github.event.inputs.time_slot }}" >> "$GITHUB_ENV"
          else
            # GitHub Actions crons can run 1-3h late on the free tier, so we use
            # generous UTC ranges rather than exact hour matching.
            # Morning  target 20:15 UTC → cover 17:00–01:59 UTC
            # Midday   target 02:00 UTC → cover 02:00–05:59 UTC
            # Afternoon target 06:30 UTC → cover 06:00–09:59 UTC
            # Evening  target 11:00 UTC → cover 10:00–16:59 UTC
            HOUR=$(date -u +%H)
            if   [ "$HOUR" -ge 17 ] || [ "$HOUR" -le 1 ]; then echo "TIME_SLOT=Morning"   >> "$GITHUB_ENV"
            elif [ "$HOUR" -ge 2  ] && [ "$HOUR" -le 5 ]; then echo "TIME_SLOT=Midday"    >> "$GITHUB_ENV"
            elif [ "$HOUR" -ge 6  ] && [ "$HOUR" -le 9 ]; then echo "TIME_SLOT=Afternoon" >> "$GITHUB_ENV"
            else                                                echo "TIME_SLOT=Evening"   >> "$GITHUB_ENV"
            fi
          fi

      - name: Run AFL digest
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TIME_SLOT:          ${{ env.TIME_SLOT }}
        run: python digest.py
