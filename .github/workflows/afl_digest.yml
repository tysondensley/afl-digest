name: AFL Digest

on:
  schedule:
    - cron: '15 20 * * *'
    - cron: '0 2 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Time slot label shown in subject line'
        required: false
        default: 'Midday'
        type: choice
        options:
          - 6am
          - Midday
          - End of Day

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve time slot
        run: |
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "TIME_SLOT=${{ github.event.inputs.time_slot }}" >> "$GITHUB_ENV"
          else
            HOUR=$(date -u +%H)
            if   [ "$HOUR" -eq 20 ]; then echo "TIME_SLOT=6am"       >> "$GITHUB_ENV"
            elif [ "$HOUR" -eq 2  ]; then echo "TIME_SLOT=Midday"    >> "$GITHUB_ENV"
            else                          echo "TIME_SLOT=End of Day" >> "$GITHUB_ENV"
            fi
          fi
      - name: Run AFL digest
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TIME_SLOT:          ${{ env.TIME_SLOT }}
        run: python digest.py
